---
- name: Install Kubernetes on Ubuntu
  hosts: all
  become: yes
  tasks:

    - name: Disable Swap
      command: swapoff -a

    - name: Ensure swap is removed from fstab
      replace:
        path: /etc/fstab
        regexp: '.*\sswap\s.*'
        replace: ''

    - name: Remove conflicting Kubernetes repository entries
      file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent

    - name: Create directory for keyrings
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Download and dearmor Kubernetes GPG key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
        dest: /usr/share/keyrings/kubernetes-archive-keyring.gpg
        mode: '0644'

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
        filename: "kubernetes.list"
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - software-properties-common
        state: present

    - name: Install Kubernetes components
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages at current version
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: hold

    - name: Enable and start kubelet service
      systemd:
        name: kubelet
        enabled: yes
        state: started
