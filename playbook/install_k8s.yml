---
  - name: ติดตั้ง Kubernetes บน Ubuntu
    hosts: all
    become: yes
    tasks:
  
      - name: ปิดการใช้งาน Swap
        command: swapoff -a
  
      - name: ลบการตั้งค่า Swap ออกจาก fstab
        replace:
          path: /etc/fstab
          regexp: '.*\sswap\s.*'
          replace: ''
  
      - name: ลบไฟล์ที่เก็บแพ็กเกจ Kubernetes ที่อาจขัดแย้ง
        find:
          paths: /etc/apt/sources.list.d/
          patterns: 'kubernetes*'
        register: repo_files
  
      - name: ลบไฟล์ที่เก็บแพ็กเกจที่ขัดแย้ง
        file:
          path: "{{ item.path }}"
          state: absent
        loop: "{{ repo_files.files }}"
        when: repo_files.matched > 0
  
      - name: สร้างไดเรกทอรีสำหรับคีย์ริง
        file:
          path: /etc/apt/keyrings
          state: directory
          mode: '0755'
  
      - name: ดาวน์โหลดและติดตั้งคีย์ GPG ของ Kubernetes
        get_url:
          url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
          dest: /etc/apt/keyrings/kubernetes-archive-keyring.gpg
          mode: '0644'
  
      - name: เพิ่มที่เก็บแพ็กเกจ Kubernetes
        apt_repository:
          repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
          filename: "kubernetes"
          state: present
  
      - name: อัปเดตแคชของ APT
        apt:
          update_cache:
  ::contentReference[oaicite:0]{index=0}
   
  