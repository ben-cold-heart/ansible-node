---
- name: Install Kubernetes on Ubuntu
  hosts: all
  become: yes
  tasks:

    - name: Disable Swap
      command: swapoff -a

    - name: Ensure swap is removed from fstab
      replace:
        path: /etc/fstab
        regexp: '.*\sswap\s.*'
        replace: ''

    - name: Install required packages
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - software-properties-common
        state: present
        update_cache: yes

    - name: Add Kubernetes apt repository
      shell: |
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key | sudo tee /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list
      args:
        executable: /bin/bash

    - name: Install kubeadm, kubelet, and kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Hold kubeadm, kubelet, and kubectl at their installed versions
      command: apt-mark hold kubelet kubeadm kubectl

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

- name: Initialize Kubernetes Master
  hosts: masters
  become: yes
  tasks:
    - name: Initialize Kubernetes cluster
      shell: kubeadm init --pod-network-cidr=192.168.1.0/16
      args:
        creates: /etc/kubernetes/admin.conf
      register: k8s_init

    - name: Copy admin.conf to root's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        owner: root
        group: root
        mode: '0600'

    - name: Install Calico network plugin
      shell: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
      when: k8s_init.changed

    - name: Generate token for worker nodes
      shell: kubeadm token create --print-join-command
      register: kubeadm_token
      when: k8s_init.changed

    - name: Save join command to a file
      copy:
        content: "{{ kubeadm_token.stdout }}"
        dest: /home/ubuntu/join-command.sh
        mode: '0755'
      when: k8s_init.changed

- name: Join Worker Nodes
  hosts: workers
  become: yes
  tasks:
    - name: Install kubeadm, kubelet, and kubectl on worker nodes
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Copy join command to worker nodes
      copy:
        src: /home/ubuntu/join-command.sh
        dest: /home/ubuntu/join-command.sh
        mode: '0755'

    - name: Join Kubernetes cluster
      command: sh /home/ubuntu/join-command.sh
