---
- name: Install Kubernetes on Ubuntu
  hosts: all
  become: yes
  tasks:

    - name: Disable Swap
      command: swapoff -a
      become: yes

    - name: Ensure swap is removed from fstab
      replace:
        path: /etc/fstab
        regexp: '.*\sswap\s.*'
        replace: ''
    
    - name: Install required packages
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - software-properties-common
        state: present
        update_cache: yes

    - name: Add Kubernetes apt repository
      shell: |
        curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key add -
        echo "deb https://apt.kubernetes.io/ kubernetes-xenial main" | sudo tee /etc/apt/sources.list.d/kubernetes.list
      args:
        executable: /bin/bash

    - name: Install kubeadm, kubelet, and kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Hold kubeadm, kubelet, and kubectl at their installed versions
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

- name: Initialize Kubernetes Master
  hosts: masters
  become: yes
  tasks:
    - name: Initialize Kubernetes cluster
      shell: kubeadm init --pod-network-cidr=192.168.1.0/16
      args:
        creates: /etc/kubernetes/admin.conf
      register: k8s_init

    - name: Create .kube directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Install Calico network plugin
      become_user: ubuntu
      shell: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
      when: k8s_init.changed

    - name: Generate token for worker nodes
      shell: kubeadm token create --print-join-command
      register: kubeadm_token
      when: k8s_init.changed

    - name: Save join command to a file
      copy:
        content: "{{ kubeadm_token.stdout }}"
        dest: /home/ubuntu/join-command.sh
        mode: '0644'
      when: k8s_init.changed

- name: Join Worker Nodes
  hosts: workers
  become: yes
  tasks:
    - name: Copy join command from master
      fetch:
        src: /home/ubuntu/join-command.sh
        dest: ./join-command.sh
        flat: yes

    - name: Join Kubernetes cluster
      command: sh ./join-command.sh
      args:
        chdir: /home/ubuntu
