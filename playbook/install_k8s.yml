---
- name: ติดตั้ง Kubernetes บน Ubuntu
  hosts: all
  become: yes
  tasks:
    - name: ปิดการใช้งาน Swap
      command: swapoff -a

    - name: ลบการตั้งค่า Swap ออกจาก fstab
      replace:
        path: /etc/fstab
        regexp: '.*\sswap\s.*'
        replace: ''

    - name: ติดตั้งแพ็กเกจที่จำเป็น
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present
        update_cache: yes

    - name: เพิ่มคีย์ GPG ของ Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: เพิ่มที่เก็บแพ็กเกจ Docker
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
        state: present

    - name: อัปเดตแคชของ APT
      apt:
        update_cache: yes

    - name: ติดตั้ง Docker
      apt:
        name: docker-ce
        state: present

    - name: สร้างไดเรกทอรีสำหรับคีย์ริงของ Kubernetes
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: ดาวน์โหลดและติดตั้งคีย์ GPG ของ Kubernetes
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-archive-keyring.gpg
        mode: '0644'

    - name: เพิ่มที่เก็บแพ็กเกจ Kubernetes
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
        filename: "kubernetes"
        state: present

    - name: อัปเดตแคชของ APT อีกครั้ง
      apt:
        update_cache: yes

    - name: ติดตั้ง Kubernetes
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: กำหนดให้แพ็กเกจ Kubernetes ไม่ถูกอัปเกรดโดยอัตโนมัติ
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: hold

    - name: เริ่มและเปิดใช้งานบริการ kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started
