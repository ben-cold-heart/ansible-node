name: Docker Installation on Target node

on:
  push:
    branches:
      - docker_installation
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ansible-node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i ./inventory.ini ./playbook/install_docker.yml
