name: Kubernates Installation on Target node

on:
  push:
    branches:
      - k8s_installation
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ansible-node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
    #   - name: Create Secure Inventory File
    #     run: |
    #       echo "[web_servers]" > inventory.ini
    #       echo "${{ secrets.ANSIBLE_INI }}" >> inventory.ini

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i ./inventory.ini ./playbook/install_k8s.yml --extra-vars "@secret.yml" --ask-vault-pass

